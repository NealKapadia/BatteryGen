[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molforge"
version = "0.2.0"
description = "Pretrained conditional SELFIES-VAE for de-novo molecule & battery-electrolyte design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "MolForge" }]
keywords = ["cheminformatics", "vae", "selfies", "molecule-generation", "electrolyte", "rdkit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Operating System :: OS Independent",
]
# Core deps: load the model, generate/encode/decode/score, fine-tune, download weights.
# NOTE: install a CUDA build of torch from https://pytorch.org first if you want GPU.
dependencies = [
    "torch>=2.2",
    "rdkit>=2023.9",
    "selfies>=2.1",
    "numpy>=1.24",
    "huggingface_hub>=0.20",
]
# See LICENSE (code) and the Hugging Face model card (weights: CC BY-NC 4.0).

[project.optional-dependencies]
# Training / preprocessing / evaluation progress bars (train.py, preprocess.py, evaluate.py)
train = ["tqdm"]
# CE inverse-design predictor + tuning (ce_*.py)
ce = ["pandas", "scikit-learn", "xgboost", "optuna", "joblib", "tqdm"]
# Local REST API / web app (server.py, webengine.py)
app = ["fastapi", "uvicorn[standard]", "python-multipart", "pandas", "scikit-learn", "joblib"]
# Natural-language request parsing + explanations (llm.py, needs Azure keys in .env)
llm = ["openai", "python-dotenv"]
# DFT grounding (qm9.py via PyTorch Geometric) + xTB-label fine-tuning
dft = ["torch-geometric", "tqdm"]
# HTML reports / charts (report.py)
report = ["matplotlib", "scikit-learn"]
# Everything above, in one install.
full = [
    "tqdm", "pandas", "scikit-learn", "joblib", "xgboost", "optuna",
    "fastapi", "uvicorn[standard]", "python-multipart",
    "openai", "python-dotenv", "torch-geometric", "matplotlib",
]

[project.urls]
Homepage = "https://github.com/NealKapadia/molforge"

# Short console commands. Each maps to a module's main() so users never type long paths.
[project.scripts]
molforge = "molforge.core.api:_main"                       # generate from the CLI
molforge-finetune = "molforge.core.finetune:main"          # fine-tune on your SMILES
molforge-preprocess = "molforge.generative.preprocess:main"
molforge-train = "molforge.generative.train:main"          # train the generative model
molforge-add-data = "molforge.generative.add_data:main"
molforge-make-split = "molforge.generative.make_split:main"
molforge-generate = "molforge.generative.generate:main"
molforge-search = "molforge.generative.search:main"
molforge-evaluate = "molforge.generative.evaluate:main"
molforge-report = "molforge.generative.report:main"
molforge-pipeline = "molforge.generative.pipeline:main"
molforge-ce-features = "molforge.predictive.ce_features:main"
molforge-ce-tune = "molforge.predictive.ce_tune:main"      # Optuna hyperparameter tuning
molforge-ce-train = "molforge.predictive.ce_train:main"    # train the predictive model
molforge-ce-design = "molforge.predictive.ce_design:main"  # full inverse-design pipeline
molforge-ce-model = "molforge.predictive.ce_model:main"
molforge-ce-rag = "molforge.predictive.ce_rag:main"        # manage the literature knowledge base
molforge-electrolyte = "molforge.electrolyte.electrolyte:main"
molforge-xtb-label = "molforge.grounding.xtb_label:main"
molforge-qm9 = "molforge.grounding.qm9:main"
molforge-finetune-dft = "molforge.grounding.finetune_dft:main"

# Map the importable package name `molforge` onto this directory; the purpose folders
# (core, generative, ...) are shipped as `molforge.<folder>` subpackages.
[tool.setuptools]
packages = [
    "molforge",
    "molforge.core",
    "molforge.generative",
    "molforge.predictive",
    "molforge.electrolyte",
    "molforge.grounding",
    "molforge.webapp",
]

[tool.setuptools.package-dir]
molforge = "."

# Ship the web UI assets with the webapp subpackage.
[tool.setuptools.package-data]
"molforge.webapp" = ["static/*"]

# Don't sweep the model weights, raw data, datasets, or local caches into the wheel.
[tool.setuptools.exclude-package-data]
"*" = ["*.pt", "*.pth", "*.pkl", "*.npy", "*.bloom", "*.sqlite", "*.csv", "*.env", ".env"]
