[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batterygen"
version = "0.2.0"
description = "Pretrained conditional SELFIES-VAE for de-novo molecule & battery-electrolyte design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "BatteryGen" }]
keywords = ["cheminformatics", "vae", "selfies", "molecule-generation", "electrolyte", "rdkit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Operating System :: OS Independent",
]
# Core deps: load the model, generate/encode/decode/score, fine-tune, download weights.
# NOTE: install a CUDA build of torch from https://pytorch.org first if you want GPU.
dependencies = [
    "torch>=2.2",
    "rdkit>=2023.9",
    "selfies>=2.1",
    "numpy>=1.24",
    "huggingface_hub>=0.20",
]
# See LICENSE (code) and the Hugging Face model card (weights: CC BY-NC 4.0).

[project.optional-dependencies]
# Training / preprocessing / evaluation progress bars (train.py, preprocess.py, evaluate.py)
train = ["tqdm"]
# Predictive + inverse-design pipeline (features/select/tune/train/design)
predict = ["pandas", "scikit-learn", "xgboost", "optuna", "joblib", "tqdm", "matplotlib"]
# Natural-language request parsing + explanations (llm.py, needs Azure keys in .env)
llm = ["openai", "python-dotenv"]
# DFT grounding (qm9.py via PyTorch Geometric) + xTB-label fine-tuning
dft = ["torch-geometric", "tqdm"]
# HTML reports / charts (report.py)
report = ["matplotlib", "scikit-learn"]
# Everything above, in one install.
full = [
    "tqdm", "pandas", "scikit-learn", "joblib", "xgboost", "optuna",
    "openai", "python-dotenv", "torch-geometric", "matplotlib",
]

[project.urls]
Homepage = "https://github.com/NealKapadia/BatteryGen"

# Short console commands. Each maps to a module's main() so users never type long paths.
[project.scripts]
batterygen = "batterygen.core.api:_main"                       # generate from the CLI
batterygen-finetune = "batterygen.core.finetune:main"          # fine-tune on your SMILES
batterygen-preprocess = "batterygen.generative.preprocess:main"
batterygen-train = "batterygen.generative.train:main"          # train the generative model
batterygen-add-data = "batterygen.generative.add_data:main"
batterygen-make-split = "batterygen.generative.make_split:main"
batterygen-generate = "batterygen.generative.generate:main"
batterygen-search = "batterygen.generative.search:main"
batterygen-evaluate = "batterygen.generative.evaluate:main"
batterygen-report = "batterygen.generative.report:main"
batterygen-pipeline = "batterygen.generative.pipeline:main"
batterygen-pred-features = "batterygen.predictive.features:main"  # 1. featurize the dataset
batterygen-pred-select = "batterygen.predictive.select:main"      # 2. shortlist features (RFE-CV)
batterygen-pred-tune = "batterygen.predictive.tune:main"          # 3. Optuna hyperparameter tuning
batterygen-pred-train = "batterygen.predictive.train:main"        # 4. train the predictive model
batterygen-pred-design = "batterygen.predictive.design:main"      # 5. full inverse-design pipeline
batterygen-pred-rag = "batterygen.predictive.rag:main"            # manage the literature knowledge base
batterygen-electrolyte = "batterygen.electrolyte.electrolyte:main"
batterygen-xtb-label = "batterygen.grounding.xtb_label:main"
batterygen-qm9 = "batterygen.grounding.qm9:main"
batterygen-finetune-dft = "batterygen.grounding.finetune_dft:main"

# Map the importable package name `batterygen` onto this directory; the purpose folders
# (core, generative, ...) are shipped as `batterygen.<folder>` subpackages.
[tool.setuptools]
packages = [
    "batterygen",
    "batterygen.core",
    "batterygen.generative",
    "batterygen.predictive",
    "batterygen.electrolyte",
    "batterygen.grounding",
]

[tool.setuptools.package-dir]
batterygen = "."

# Don't sweep the model weights, raw data, datasets, or local caches into the wheel.
[tool.setuptools.exclude-package-data]
"*" = ["*.pt", "*.pth", "*.pkl", "*.npy", "*.bloom", "*.sqlite", "*.csv", "*.env", ".env"]
